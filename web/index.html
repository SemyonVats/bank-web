<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vats Bank</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<main class="shell">
  <header class="hero">
    <div>
      <p class="eyebrow">Локальный банк</p>
      <h1>Управление счетами</h1>
      <p>Создайте клиента, откройте счёт и проводите операции без командной строки.</p>
    </div>
    <div class="status"><span></span> Сервер работает</div>
  </header>

  <section class="grid">
    <article class="card">
      <div class="card-title"><span>01</span><h2>Клиент</h2></div>
      <form id="person-form">
        <label>Имя<input name="firstName" autocomplete="given-name" required></label>
        <label>Фамилия<input name="lastName" autocomplete="family-name" required></label>
        <label>Паспорт<input name="passport" required></label>
        <button type="submit">Создать или проверить</button>
      </form>
      <div class="divider"><span>или</span></div>
      <form id="person-search" class="inline-form">
        <input name="passport" placeholder="Паспорт" required>
        <button type="submit" class="secondary">Найти</button>
      </form>
    </article>

    <article class="card account-card">
      <div class="card-title"><span>02</span><h2>Счета</h2></div>
      <div id="empty-state" class="empty-state">
        <strong>Клиент не выбран</strong>
        <p>Создайте или найдите клиента — здесь появятся его счета.</p>
      </div>
      <div id="person-panel" class="hidden">
        <div class="person-summary">
          <div><small>Клиент</small><strong id="person-name"></strong></div>
          <div><small>Паспорт</small><code id="person-passport"></code></div>
        </div>
        <form id="account-form" class="inline-form">
          <input name="subId" placeholder="Номер нового счёта" required>
          <button type="submit">Открыть счёт</button>
        </form>
        <div id="accounts" class="accounts"></div>
      </div>
    </article>
  </section>
</main>

<div id="toast" class="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
